name: Package Korean test build

on:
  push:
    branches:
      - package-test-build
    paths:
      - '.github/workflows/package-ko-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/MAW_Korean_4.5_TEST
          cp -a korean/Data dist/MAW_Korean_4.5_TEST/
          cp -a korean/Scripts dist/MAW_Korean_4.5_TEST/
          cp korean/manifest.json dist/MAW_Korean_4.5_TEST/manifest.json
          cat > dist/MAW_Korean_4.5_TEST/INSTALL_TEST.txt <<'EOF'
          MAW MMMerge 4.5 한국어화 테스트판

          설치 순서
          1. 기존 한국어 MMMerge 설치
          2. MAW MMMerge 4.5 설치
          3. 이 압축파일의 MAW_Korean_4.5_TEST 폴더 안 Data / Scripts 폴더를 게임 루트에 덮어쓰기

          주의
          - MAW 4.5 안정판 기준 테스트판입니다.
          - 세이브는 테스트 전 백업을 권장합니다.
          - 미번역/오역/글자 깨짐/UI 이상/기능 이상이 보이면 스크린샷과 위치를 제보해 주세요.

          기준 한국어화 HEAD: 9e4038c578731002a130c406ad56a13d3c0547b5
          MAW 4.5 기준 커밋: 342f34edf73dbd72808422cc56f4602959a94030
          EOF
          (cd dist && zip -r -9 MAW_Korean_4.5_TEST_20260910.zip MAW_Korean_4.5_TEST >/dev/null)
          sha256sum dist/MAW_Korean_4.5_TEST_20260910.zip | tee dist/SHA256SUMS.txt

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: MAW_Korean_4.5_TEST_20260910
          path: |
            dist/MAW_Korean_4.5_TEST_20260910.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
