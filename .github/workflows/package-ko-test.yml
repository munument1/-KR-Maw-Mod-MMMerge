name: Package Korean test build

on:
  push:
    branches:
      - package-test-build
    paths:
      - '.github/workflows/package-ko-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build complete MAW 4.5 Korean test package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          ROOT="dist/MAW_4.5_KO_TEST"
          mkdir -p "$ROOT"

          # Ship the complete MAW 4.5 mod payload, not only translated files.
          # This prevents translated scripts from being installed without their
          # exact 4.5 dependencies (for example zzzOnlineVariableSender.lua
          # requires MawAddTimer from zzMaw-Timers.lua).
          cp -a Data "$ROOT/"
          cp -a ExeMods "$ROOT/"
          cp -a Scripts "$ROOT/"

          # Apply the generated Korean overlay last.
          cp -a korean/Data/. "$ROOT/Data/"
          cp -a korean/Scripts/. "$ROOT/Scripts/"
          cp korean/manifest.json "$ROOT/KO_manifest.json"

          # Dependency sanity checks for the exact failure seen in testing.
          test -f "$ROOT/Scripts/General/zzMaw-Timers.lua"
          test -f "$ROOT/Scripts/General/zzzOnlineVariableSender.lua"
          grep -q 'function MawAddTimer' "$ROOT/Scripts/General/zzMaw-Timers.lua"
          grep -q 'MawAddTimer("healthSync"' "$ROOT/Scripts/General/zzzOnlineVariableSender.lua"

          # All Lua sources must be valid UTF-8 without BOM/replacement chars.
          python - <<'PY'
          from pathlib import Path
          root = Path('dist/MAW_4.5_KO_TEST')
          files = sorted(root.rglob('*.lua'))
          assert files, 'no Lua files packaged'
          bad = []
          for p in files:
              b = p.read_bytes()
              if b.startswith(b'\xef\xbb\xbf'):
                  bad.append(f'{p}: UTF-8 BOM')
                  continue
              try:
                  s = b.decode('utf-8', errors='strict')
              except UnicodeDecodeError as e:
                  bad.append(f'{p}: invalid UTF-8: {e}')
                  continue
              if '\ufffd' in s:
                  bad.append(f'{p}: U+FFFD replacement character')
          if bad:
              raise SystemExit('\n'.join(bad))
          print(f'UTF-8 check passed: {len(files)} Lua files; BOM=0; U+FFFD=0')
          PY

          # Korean LOD must be present alongside the original MAW localization LOD.
          test -s "$ROOT/Data/zMaw.T.lod"
          test -s "$ROOT/Data/zzzMawKO.T.lod"

          cat > "$ROOT/INSTALL_TEST.txt" <<'EOF'
          MAW MMMerge 4.5 한국어화 완전판 테스트 빌드

          중요
          - 이전에 받은 patch-only 테스트 ZIP은 사용하지 마세요.
          - 이 빌드는 MAW 4.5 원본 파일과 한국어 오버레이를 함께 포함합니다.
          - 가장 안전한 테스트는 깨끗한 MMMerge 설치본에 이 폴더의 내용을 덮어쓰는 것입니다.
          - 기존 MAW 4.0/다른 포크/MAW 5.x 개발판 위에 섞어 설치하지 마세요.

          권장 설치 순서
          1. Might and Magic VIII + MMMerge 기반을 준비합니다.
          2. 필요한 Rodril/MMMerge 및 멀티플레이 기반 파일을 먼저 설치합니다.
          3. 이 MAW_4.5_KO_TEST 폴더 안의 Data / ExeMods / Scripts를 게임 루트에 덮어씁니다.
          4. 기존 다른 버전 MAW 파일이 섞인 폴더보다는 별도 테스트 복사본을 권장합니다.

          검증
          - 전체 MAW 4.5 Scripts 포함
          - zzMaw-Timers.lua의 MawAddTimer 정의 존재 확인
          - zzzOnlineVariableSender.lua의 healthSync 의존성 확인
          - 모든 Lua UTF-8 strict 검사 / BOM 없음 / U+FFFD 없음
          - Data/zMaw.T.lod + Data/zzzMawKO.T.lod 동시 포함

          MAW 4.5 기준 커밋: 342f34edf73dbd72808422cc56f4602959a94030
          한국어화 기준 HEAD: 9e4038c578731002a130c406ad56a13d3c0547b5
          EOF

          (cd dist && zip -r -9 MAW_4.5_KO_TEST_20260910.zip MAW_4.5_KO_TEST >/dev/null)
          sha256sum dist/MAW_4.5_KO_TEST_20260910.zip | tee dist/SHA256SUMS.txt

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: MAW_4.5_KO_TEST_20260910
          path: |
            dist/MAW_4.5_KO_TEST_20260910.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
