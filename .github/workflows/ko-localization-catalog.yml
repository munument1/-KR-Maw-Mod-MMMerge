name: Korean localization catalog

on:
  workflow_dispatch:
  push:
    branches:
      - korean-localization-4.5
    paths:
      - 'Scripts/**'
      - 'Data/Tables/**'
      - 'tools/extract_maw_strings.py'
      - 'localization/**'
      - '.github/workflows/ko-localization-catalog.yml'

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: korean-localization-4.5
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build localization catalog
        run: |
          python tools/extract_maw_strings.py --root . --check

      - name: Check whitespace
        run: git diff --check

      - name: Commit refreshed catalog
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add localization/catalog.tsv localization/occurrences.tsv localization/report.json
          if git diff --cached --quiet; then
            echo 'Catalog already up to date.'
            exit 0
          fi
          git commit -m 'chore: refresh MAW localization catalog [skip ci]'
          git push origin HEAD:korean-localization-4.5
