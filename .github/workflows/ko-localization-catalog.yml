name: Korean localization catalog

on:
  workflow_dispatch:
  push:
    branches:
      - korean-localization-4.5
    paths:
      - 'Scripts/**'
      - 'Data/Tables/**'
      - 'tools/extract_maw_strings.py'
      - 'tools/refine_patchability.py'
      - 'tools/export_patchable_candidates.py'
      - 'tools/import_mmmerge_memory.py'
      - 'tools/build_ko_overlay.py'
      - 'tools/merge_translation_batches.py'
      - 'localization/**'
      - 'localization/batches/**'
      - '.github/workflows/ko-localization-catalog.yml'

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: korean-localization-4.5
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge reviewed translation batches
        run: python tools/merge_translation_batches.py --root .

      - name: Build localization catalog
        run: python tools/extract_maw_strings.py --root . --translations localization/all_translations.tsv --check

      - name: Refine individual string patchability
        run: python tools/refine_patchability.py --root .

      - name: Export focused patchable queue
        run: python tools/export_patchable_candidates.py --root .

      - name: Match MMMerge Korean translation memory
        run: python tools/import_mmmerge_memory.py --root .

      - name: Build Korean overlay
        run: python tools/build_ko_overlay.py --root . --check

      - name: Check whitespace
        run: git diff --check

      - name: Commit generated localization data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add localization/catalog.tsv localization/occurrences.tsv localization/report.json localization/patchable_candidates.tsv localization/mmmerge_matches.tsv localization/mmmerge_match_report.json korean/
          if git diff --cached --quiet; then
            echo 'Generated localization data already up to date.'
            exit 0
          fi
          git commit -m 'chore: refresh MAW Korean overlay [skip ci]'
          git push origin HEAD:korean-localization-4.5
