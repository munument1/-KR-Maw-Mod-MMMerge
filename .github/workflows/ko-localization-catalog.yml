name: Korean localization catalog

on:
  workflow_dispatch:
  push:
    branches:
      - korean-localization-4.5
    paths:
      - 'Scripts/**'
      - 'Data/Tables/**'
      - 'tools/extract_maw_strings.py'
      - 'tools/augment_reviewed_short_literals.py'
      - 'tools/classify_structural_tables.py'
      - 'tools/classify_lua_comment_literals.py'
      - 'tools/classify_internal_literals.py'
      - 'tools/refine_uncertain_internal.py'
      - 'tools/refine_batch026_internal.py'
      - 'tools/promote_display_literals.py'
      - 'tools/promote_alchemy_tooltips.py'
      - 'tools/promote_monster_tooltips.py'
      - 'tools/promote_map_item_tooltips.py'
      - 'tools/promote_direct_ui_literals.py'
      - 'tools/promote_monster_ui_fields.py'
      - 'tools/promote_legendary_item_tooltips.py'
      - 'tools/promote_item_enchantment_labels.py'
      - 'tools/promote_settings_headers.py'
      - 'tools/promote_reviewed_display_strings.py'
      - 'tools/promote_batch026_display.py'
      - 'tools/promote_batch027_display.py'
      - 'tools/promote_batch028_display.py'
      - 'tools/finalize_reviewed_nonruntime.py'
      - 'tools/refine_patchability.py'
      - 'tools/export_patchable_candidates.py'
      - 'tools/export_uncertain_candidates.py'
      - 'tools/export_untranslated_queue.py'
      - 'tools/import_mmmerge_memory.py'
      - 'tools/build_ko_overlay.py'
      - 'tools/apply_korean_runtime_fixes.py'
      - 'tools/apply_mapstats_key_compat.py'
      - 'tools/apply_runtime_residual_fixes.py'
      - 'tools/scan_runtime_english.py'
      - 'tools/merge_translation_batches.py'
      - 'localization/**'
      - 'localization/batches/**'
      - '.github/workflows/ko-localization-catalog.yml'

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: korean-localization-4.5
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge reviewed translation batches
        run: python tools/merge_translation_batches.py --root .

      - name: Build localization catalog
        run: python tools/extract_maw_strings.py --root . --translations localization/all_translations.tsv --check

      - name: Add reviewed short display literals
        run: python tools/augment_reviewed_short_literals.py --root .

      - name: Classify audited structural tables
        run: python tools/classify_structural_tables.py --root .

      - name: Classify Lua block-comment literals
        run: python tools/classify_lua_comment_literals.py --root .

      - name: Refine individual string patchability
        run: python tools/refine_patchability.py --root .

      - name: Classify internal engine literals
        run: python tools/classify_internal_literals.py --root .

      - name: Refine uncertain internal literals
        run: python tools/refine_uncertain_internal.py --root .

      - name: Refine batch 026 reviewed internal literals
        run: python tools/refine_batch026_internal.py --root .

      - name: Reclassify refined internal literals
        run: python tools/classify_internal_literals.py --root .

      - name: Promote proven display assignments
        run: python tools/promote_display_literals.py --root .

      - name: Promote alchemy item tooltips
        run: python tools/promote_alchemy_tooltips.py --root .

      - name: Promote monster information labels
        run: python tools/promote_monster_tooltips.py --root .

      - name: Promote map item tooltips
        run: python tools/promote_map_item_tooltips.py --root .

      - name: Promote direct UI literals
        run: python tools/promote_direct_ui_literals.py --root .

      - name: Promote monster inspection UI
        run: python tools/promote_monster_ui_fields.py --root .

      - name: Promote legendary item tooltips
        run: python tools/promote_legendary_item_tooltips.py --root .

      - name: Promote item enchantment labels
        run: python tools/promote_item_enchantment_labels.py --root .

      - name: Promote settings page headers
        run: python tools/promote_settings_headers.py --root .

      - name: Promote bulk reviewed display strings
        run: python tools/promote_reviewed_display_strings.py --root .

      - name: Promote batch 026 reviewed display strings
        run: python tools/promote_batch026_display.py --root .

      - name: Promote batch 027 reviewed display strings
        run: python tools/promote_batch027_display.py --root .

      - name: Promote batch 028 mastery labels
        run: python tools/promote_batch028_display.py --root .

      - name: Finalize reviewed non-runtime strings
        run: python tools/finalize_reviewed_nonruntime.py --root . --check

      - name: Export focused patchable queue
        run: python tools/export_patchable_candidates.py --root . --check

      - name: Match MMMerge Korean translation memory
        run: python tools/import_mmmerge_memory.py --root .

      - name: Export uncertain Lua review queue
        run: python tools/export_uncertain_candidates.py --root .

      - name: Export one-line untranslated queue
        run: python tools/export_untranslated_queue.py --root .

      - name: Build Korean overlay
        run: python tools/build_ko_overlay.py --root . --check

      - name: Apply Korean runtime display fixes
        run: python tools/apply_korean_runtime_fixes.py --root . --check

      - name: Preserve localized MapStats save keys
        run: python tools/apply_mapstats_key_compat.py --root . --check

      - name: Apply runtime residual fixes
        run: python tools/apply_runtime_residual_fixes.py --root . --check

      - name: Scan effective runtime English
        run: python tools/scan_runtime_english.py --root . --check

      - name: Check authored-file whitespace
        run: git diff --check -- . ':!localization/*.tsv' ':!korean/**'

      - name: Commit generated localization data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add localization/catalog.tsv localization/occurrences.tsv localization/report.json localization/patchable_candidates.tsv localization/uncertain_candidates.tsv localization/untranslated_queue.tsv localization/mmmerge_matches.tsv localization/mmmerge_match_report.json localization/runtime_english_residuals.tsv localization/runtime_english_report.json korean/
          if git diff --cached --quiet; then
            echo 'Generated localization data already up to date.'
            exit 0
          fi
          git commit -m 'chore: refresh MAW Korean overlay [skip ci]'
          git push origin HEAD:korean-localization-4.5
