name: zMaw.T.lod Korean audit

on:
  workflow_dispatch:
  push:
    branches:
      - korean-localization-4.5
    paths:
      - 'Data/zMaw.T.lod'
      - 'tools/audit_zmaw_lod.py'
      - 'tools/audit_zmaw_rnditems.py'
      - 'tools/build_korean_zmaw_lod_stage.py'
      - 'tools/export_zmaw_potion_display.py'
      - 'tools/build_korean_zmaw_potions.py'
      - '.github/workflows/zmaw-lod-audit.yml'

permissions:
  contents: write

jobs:
  lod-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: korean-localization-4.5
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned mmarch
        run: cargo install mmarch --version 7.0.0 --locked

      - name: Verify mmarch version
        run: test "$(mmarch version)" = "7.0.0"

      - name: Extract zMaw.T.lod text resources
        shell: bash
        run: |
          rm -rf localization/zmaw_lod_source
          mkdir -p localization/zmaw_lod_source
          mmarch --ec strict extract Data/zMaw.T.lod localization/zmaw_lod_source "*.txt"

      - name: Audit embedded localization tables
        run: python tools/audit_zmaw_lod.py --source-dir localization/zmaw_lod_source --manifest localization/zmaw_lod_manifest.json --archive-sha f250f60d68982ce6e7df105554c47323bb105f0e

      - name: Audit random item schema
        run: python tools/audit_zmaw_rnditems.py --source-dir localization/zmaw_lod_source --report localization/zmaw_rnditems_report.json

      - name: Audit potion display fields
        run: python tools/export_zmaw_potion_display.py --source-dir localization/zmaw_lod_source --output localization/zmaw_potion_display.tsv --report localization/zmaw_potion_display_report.json

      - name: Build Korean MAW table stage
        run: python tools/build_korean_zmaw_lod_stage.py --source-dir localization/zmaw_lod_source --stage-dir localization/zmaw_lod_ko_stage --report localization/zmaw_lod_ko_report.json

      - name: Localize potion display fields
        run: python tools/build_korean_zmaw_potions.py --stage-dir localization/zmaw_lod_ko_stage --audit localization/zmaw_potion_display.tsv --review localization/zmaw_potion_ko.tsv --report localization/zmaw_lod_ko_report.json

      - name: Create post-MAW Korean LOD
        shell: bash
        run: |
          mkdir -p korean/Data
          rm -f korean/Data/zzzMawKO.T.lod
          mmarch --ec strict create korean/Data/zzzMawKO.T.lod mm8loclod . "localization/zmaw_lod_ko_stage/*"
          test -s korean/Data/zzzMawKO.T.lod

      - name: Validate LOD round trip
        shell: bash
        run: |
          rm -rf localization/zmaw_lod_roundtrip
          mkdir -p localization/zmaw_lod_roundtrip
          mmarch --ec strict extract korean/Data/zzzMawKO.T.lod localization/zmaw_lod_roundtrip "*.txt"
          test "$(find localization/zmaw_lod_roundtrip -maxdepth 1 -type f | wc -l)" -eq 9
          for source in localization/zmaw_lod_ko_stage/*; do
            name="$(basename "$source")"
            target="$(find localization/zmaw_lod_roundtrip -maxdepth 1 -type f -iname "$name" -print -quit)"
            test -n "$target"
            cmp "$source" "$target"
          done
          rm -rf localization/zmaw_lod_roundtrip

      - name: Check generated text
        run: git diff --check -- localization/zmaw_lod_source localization/zmaw_lod_manifest.json localization/zmaw_rnditems_report.json localization/zmaw_potion_display.tsv localization/zmaw_potion_display_report.json localization/zmaw_potion_ko.tsv localization/zmaw_lod_ko_report.json

      - name: Commit generated LOD audit and overlay
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add localization/zmaw_lod_source localization/zmaw_lod_manifest.json localization/zmaw_rnditems_report.json localization/zmaw_potion_display.tsv localization/zmaw_potion_display_report.json localization/zmaw_potion_ko.tsv localization/zmaw_lod_ko_report.json korean/Data/zzzMawKO.T.lod
          if git diff --cached --quiet; then
            echo 'zMaw.T.lod Korean overlay already up to date.'
            exit 0
          fi
          git commit -m 'chore: refresh Korean zMaw.T.lod overlay [skip ci]'
          git push origin HEAD:korean-localization-4.5
